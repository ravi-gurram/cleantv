<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>CleanTV</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="root">
    <div class="bg" id="bgA"></div>
    <div class="bg" id="bgB"></div>
    <div class="vignette"></div>

    <header class="status">
      <div id="date" class="date"></div>
      <div id="time" class="time">--:--</div>
    </header>

    <section class="hero" id="hero">
      <div class="hero-kicker" id="heroKicker">Watch</div>
      <div class="hero-title" id="heroTitle"></div>
      <div class="hero-sub" id="heroSub">Press OK to open</div>
    </section>

    <section class="shelf" id="shelf">
      <div class="shelf-inner" id="shelfInner"></div>
    </section>

    <div id="toast" class="toast"></div>
  </div>
  <script src="js/apps.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
